services:
  paperbot:
    build: .
    container_name: paperbot
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # SQLite kalıcıolsun diye konteyner içi yol
      DATABASE_URL: sqlite:///./data/paperbot.db
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
